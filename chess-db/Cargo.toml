[package]
name = "chess-db"
version = "0.9.0"
edition = "2021"

[[bin]]
name = "chess-db"
path = "src/main.rs"

[dependencies]
# PGN parsing
pgn-reader = "0.29.0"
shakmaty = "0.30.0"

# Database
duckdb = { version = "1.10500.0", features = ["bundled"] }

# CLI
clap = { version = "4.6.0", features = ["derive"] }

# HTTP / async
reqwest = { version = "0.12", features = ["blocking", "rustls-tls", "stream", "json"], default-features = false }
tokio = { version = "1", features = ["full"] }

# Progress
indicatif = "0.18"

# Zip extraction
zip = "8"
# Zstandard decompression (Lichess .pgn.zst broadcast files, #40 Phase B2)
zstd = "0.13"
# 7z/LZMA decompression (Ajedrez Data historical .7z, #40 Phase B3)
sevenz-rust2 = "0.21"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP server
axum = "0.8"
# Stream adapters for SSE job-progress streaming (BroadcastStream).
tokio-stream = { version = "0.1", features = ["sync"] }
# ReaderStream, to stream a built backup file as an HTTP response body (#121).
tokio-util = { version = "0.7", features = ["io"] }
# CORS so the bundled webview (origin tauri://localhost) can call the sidecar.
tower-http = { version = "0.7", features = ["cors"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Parallelism
rayon = "1"

# Misc
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
dirs = "6"
regex = "1"

# Allocator — jemalloc avoids glibc heap corruption with DuckDB on Linux
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.7"

# Windows: read physical RAM via GlobalMemoryStatusEx so DuckDB's memory_limit
# is tuned to the machine instead of the conservative 8GiB fallback (which can
# exceed usable RAM on small boxes and make heavy ops like index-positions
# thrash/OOM).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation", "Win32_Foundation"] }
