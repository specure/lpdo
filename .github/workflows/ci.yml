name: CI

# Fast pre-merge checks so dependency bumps and code changes don't land
# unverified:
#   * frontend  — `npm ci` + the production build (tsc + vite), which catches
#                 dependency-bump breakage and TypeScript errors.
#   * chess-db  — the Rust sidecar's unit tests (importer, etc.).
#
# The full Tauri bundle (and the signed macOS/Windows installers) is built by
# release.yml on a version tag, so it's intentionally NOT repeated here — this
# stays fast enough to run on every push and pull request, including Dependabot.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid pushes / PR updates).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on PR branches (rapid pushes), but never on main —
  # every main commit should get a completed CI run, since releases are tagged
  # off main.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: chess-client/package-lock.json
      - name: Install dependencies
        working-directory: chess-client
        run: npm ci
      - name: Build (tsc + vite)
        working-directory: chess-client
        run: npm run build

  chess-db:
    name: chess-db tests
    runs-on: ubuntu-22.04
    env:
      # Cache Rust compilation via sccache, backed by the GitHub Actions cache.
      # The win: PR branches (e.g. Dependabot) start near-cold because branch
      # caches are isolated, so they recompile the world — sccache restores
      # per-crate compilations from main's cache even when the lockfile differs,
      # turning the slow dependency-bump builds into mostly cache hits.
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7
      # Version kept in sync with /rust-toolchain.toml (the source of truth).
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy
      - uses: mozilla-actions/sccache-action@v0.0.10
      # Keep rust-cache too: it restores a ready target/ for the common
      # lock-unchanged build (fastest path), while sccache covers the
      # lock-changed / cold-branch case with granular per-crate hits.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '.'
      - name: Test
        run: cargo test -p chess-db
      - name: Clippy
        run: cargo clippy -p chess-db -- -D warnings
      - name: sccache stats
        if: always()
        run: sccache --show-stats
