# Phone trainer (#327) — publish the static web app to GitHub Pages:
#   https://specure.github.io/lpdo/trainer/        — main, the real one
#   https://specure.github.io/lpdo/trainer-next/   — the preview
#
# Built from chess-client (vite.trainer.config.ts → dist-trainer/) and copied
# into the gh-pages branch — trainer/ when the trainer's code changes on
# main, trainer-next/ on a push to the `trainer-next` branch (any branch
# pushed there: `git push -f origin HEAD:trainer-next`), so a change is on
# the phone in a few minutes without waiting for CI and CodeQL on the pull
# request. By hand, the folder is chosen. The rest of gh-pages (the APT
# repository) is checked out and published as it is. The preview is its own
# page to add to the Home Screen, with its own chapters and cards: a web app
# on an iPhone's Home Screen has a store of its own, so nothing is shared
# with the real trainer there (two Safari tabs would share).
name: Phone trainer

on:
  push:
    branches: [main, trainer-next]
    paths:
      - "chess-client/src/trainer/**"
      - "chess-client/src/trainer-app/**"
      - "chess-client/trainer/**"
      - "chess-client/vite.trainer.config.ts"
      - "chess-client/src/index.css"
      - "chess-client/package-lock.json"
      - ".github/workflows/trainer.yml"
  workflow_dispatch:
    inputs:
      folder:
        description: "Where on the page: trainer (the real one) or trainer-next (the preview)"
        type: choice
        options: [trainer-next, trainer]
        default: trainer-next

permissions:
  contents: write   # push to the gh-pages branch

# One push to gh-pages at a time — shared with apt-repo.yml.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: src

      - name: Which folder
        id: where
        run: |
          folder="${{ inputs.folder }}"
          if [ -z "$folder" ]; then
            if [ "${{ github.ref_name }}" = main ]; then folder=trainer; else folder=trainer-next; fi
          fi
          echo "folder=$folder" >> "$GITHUB_OUTPUT"
          echo "Publishing ${{ github.ref_name }} (${{ github.sha }}) to $folder/"

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/chess-client/package-lock.json

      - name: Build the trainer
        working-directory: src/chess-client
        run: |
          npm ci
          npm run trainer:build

      - name: Check out existing gh-pages
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages

      - name: Put the trainer in place
        run: |
          rm -rf "gh-pages/${{ steps.where.outputs.folder }}"
          cp -r src/chess-client/dist-trainer "gh-pages/${{ steps.where.outputs.folder }}"
          touch gh-pages/.nojekyll

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages
          publish_branch: gh-pages
          force_orphan: false
          commit_message: "${{ steps.where.outputs.folder }}: publish ${{ github.ref_name }} ${{ github.sha }}"
