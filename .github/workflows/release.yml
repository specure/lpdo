name: Release

# Builds the LPDO desktop app for Debian/Linux, Windows and macOS (Apple
# Silicon) and attaches the installers to a DRAFT GitHub release for review
# before publishing.
#
# Triggered by pushing a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`)
# or manually via "Run workflow" (provide a tag name).
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   CHESSVAULT_NORMALISE_API_KEY — baked into the chess-db sidecar at compile time
#     so the released app can use the name-normalisation cache service. Without it
#     the app still works (FIDE-only normalisation).
#
#   macOS code-signing + notarization. The macOS leg ships a .pkg that installs the
#   GUI + a system launchd daemon (see the pkg steps below). The .app is signed with
#   the Developer ID *Application* cert; the .pkg with the Developer ID *Installer*
#   cert (a separate cert). If the Installer secrets are unset the .pkg still builds,
#   just unsigned (right-click→Open for local testing, not shippable):
#     APPLE_CERTIFICATE                     — base64 of the Developer ID Application .p12
#     APPLE_CERTIFICATE_PASSWORD            — the .p12 export password
#     APPLE_SIGNING_IDENTITY                — e.g. "Developer ID Application: SPECURE GmbH (4XZ94A6MUA)"
#     APPLE_INSTALLER_CERTIFICATE           — base64 of the Developer ID Installer .p12 (signs the .pkg)
#     APPLE_INSTALLER_CERTIFICATE_PASSWORD  — that .p12's export password
#     APPLE_API_ISSUER                      — App Store Connect API Issuer ID (UUID)
#     APPLE_API_KEY                         — App Store Connect API Key ID
#     APPLE_API_KEY_P8                      — contents of the App Store Connect API .p8 file

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for the draft release (e.g. v0.1.0)'
        required: true
        default: 'v0.0.0-test'

permissions:
  contents: write   # create the release and upload assets

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The GUI deb is a pure thin client (no bundled chess-db — the binary
          # is lpdo-cli, the daemon is lpdo-server). No AppImage: it had no daemon
          # to connect to once the embedded server was removed (#79).
          - os: ubuntu-22.04
            sidecar_src: target/release/chess-db
            sidecar_dst: chess-client/src-tauri/binaries/chess-db-x86_64-unknown-linux-gnu
            bundles: deb
          # Pinned to windows-2022 (MSVC 14.4x): newer images ship a Visual
          # Studio 18 MSVC that drops `stdext::checked_array_iterator`, which
          # DuckDB's vendored `fmt` still uses — so libduckdb-sys fails to
          # compile on `windows-latest`. Revisit when the duckdb crate vendors a
          # fmt that builds on the newer MSVC.
          - os: windows-2022
            sidecar_src: target/release/chess-db.exe
            sidecar_dst: chess-client/src-tauri/binaries/chess-db-x86_64-pc-windows-msvc.exe
            # NSIS .exe only — a single Windows download avoids the "which one
            # do I click?" choice. .msi (WiX) dropped; re-add if enterprise/MDM
            # (Intune/GPO) deployment is ever needed.
            bundles: nsis
          # macOS on Apple Silicon (M1+). The macos-14 runner is arm64, so the
          # default host target is aarch64-apple-darwin — no extra rustup target
          # needed. We build the `.app` (signed with the Developer ID Application
          # cert) and then wrap it in a `.pkg` (steps below) that installs the GUI
          # + a system launchd daemon, signed with the Developer ID Installer cert
          # + notarized. We ship the `.pkg` only (no `.dmg`): one installer that
          # always sets up the server, no "which one?" choice.
          - os: macos-14
            sidecar_src: target/release/chess-db
            sidecar_dst: chess-client/src-tauri/binaries/chess-db-aarch64-apple-darwin
            bundles: app

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: chess-client/package-lock.json

      - name: Setup Rust
        # Version kept in sync with /rust-toolchain.toml (the source of truth).
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '.'

      - name: Install frontend dependencies
        working-directory: chess-client
        run: npm ci

      # Build the chess-db sidecar separately so the secret key is baked in via
      # option_env! (build.rs forces a rebuild when the key changes). `tauri build`
      # does NOT recompile chess-db — it bundles the binary we copy here.
      - name: Build chess-db sidecar (with cache-service key)
        shell: bash
        env:
          CHESSVAULT_NORMALISE_API_KEY: ${{ secrets.CHESSVAULT_NORMALISE_API_KEY }}
        run: |
          cargo build -p chess-db --release
          mkdir -p "$(dirname "${{ matrix.sidecar_dst }}")"
          cp "${{ matrix.sidecar_src }}" "${{ matrix.sidecar_dst }}"

      # Windows server component: WinSW supervises `chess-db serve` as a Windows
      # service. Fetch the wrapper (renamed LPDOServer.exe) so Tauri bundles it as
      # a resource (tauri.windows.conf.json) alongside its LPDOServer.xml.
      - name: Fetch WinSW (Windows service wrapper)
        if: matrix.os == 'windows-2022'
        shell: bash
        run: |
          WINSW_VER=v2.12.0
          curl -sSL -o chess-client/src-tauri/windows/service/LPDOServer.exe \
            "https://github.com/winsw/winsw/releases/download/${WINSW_VER}/WinSW-x64.exe"
          ls -la chess-client/src-tauri/windows/service/

      # macOS notarization authenticates with an App Store Connect API key. The
      # key's .p8 is a file on disk, but secrets are strings, so materialise it
      # into the runner's temp dir and hand tauri-action the path. macOS only —
      # the other targets don't sign.
      - name: Write notarization API key
        if: matrix.os == 'macos-14'
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build app and attach to draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code-signing + notarization. tauri-action imports the cert into
          # a temporary keychain and runs notarytool when these are present; on
          # Linux/Windows they're unset and ignored. If the cert secret is empty
          # the macOS build still succeeds — just unsigned.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
        with:
          projectPath: chess-client
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'LPDO ${{ github.event.inputs.tag || github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: --bundles ${{ matrix.bundles }}

      # ── macOS .pkg: GUI + system launchd daemon ───────────────────────────────
      # tauri-action above produced the signed LPDO.app; here we wrap it in a
      # product .pkg whose postinstall registers the system daemon (mirrors the
      # Linux .deb block below). The .pkg is signed with the Developer ID Installer
      # cert + notarized; if that secret is absent it builds UNSIGNED for local
      # testing (right-click→Open), so dry-runs work before the cert exists.
      - name: Import Developer ID Installer certificate
        if: matrix.os == 'macos-14'
        shell: bash
        env:
          APPLE_INSTALLER_CERTIFICATE: ${{ secrets.APPLE_INSTALLER_CERTIFICATE }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_INSTALLER_CERTIFICATE:-}" ]; then
            echo "No APPLE_INSTALLER_CERTIFICATE — building an UNSIGNED .pkg (local testing only)."
            echo "LPDO_PKG_SIGN=0" >> "$GITHUB_ENV"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/lpdo-installer.keychain-db"
          KEYCHAIN_PW="$(openssl rand -hex 20)"
          P12="$RUNNER_TEMP/installer.p12"
          printf '%s' "$APPLE_INSTALLER_CERTIFICATE" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$APPLE_INSTALLER_CERTIFICATE_PASSWORD" \
            -T /usr/bin/productbuild -T /usr/bin/productsign -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)
          echo "LPDO_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "LPDO_PKG_SIGN=1" >> "$GITHUB_ENV"

      - name: Build the product .pkg
        if: matrix.os == 'macos-14'
        shell: bash
        env:
          INSTALLER_IDENTITY: "Developer ID Installer: SPECURE GmbH (4XZ94A6MUA)"
        run: |
          set -euo pipefail
          VER="$(jq -r .version chess-client/src-tauri/tauri.conf.json)"
          # Cargo workspace → the bundle lands in the repo-root target dir, not
          # under chess-client/src-tauri (matches sidecar_src: target/release/...).
          APP="target/release/bundle/macos/LPDO.app"
          test -d "$APP"
          echo "App bundle contents (confirm the chess-db sidecar path):"
          ls "$APP/Contents/MacOS/"
          test -x "$APP/Contents/MacOS/chess-db"

          SCRIPTS="$RUNNER_TEMP/pkg-scripts"
          mkdir -p "$SCRIPTS"
          cp chess-client/src-tauri/macos/scripts/postinstall "$SCRIPTS/postinstall"
          cp chess-client/src-tauri/macos/com.specure.lpdo.server.plist "$SCRIPTS/"
          cp chess-client/src-tauri/macos/uninstall-lpdo.sh "$SCRIPTS/"
          chmod +x "$SCRIPTS/postinstall"

          pkgbuild --component "$APP" --install-location /Applications \
            --scripts "$SCRIPTS" --identifier com.specure.lpdo --version "$VER" \
            "$RUNNER_TEMP/LPDO-component.pkg"

          mkdir -p dist-pkg
          OUT="dist-pkg/LPDO_${VER}_aarch64.pkg"
          if [ "${LPDO_PKG_SIGN:-0}" = "1" ]; then
            productbuild --package "$RUNNER_TEMP/LPDO-component.pkg" \
              --sign "$INSTALLER_IDENTITY" --keychain "$LPDO_KEYCHAIN" "$OUT"
          else
            productbuild --package "$RUNNER_TEMP/LPDO-component.pkg" "$OUT"
          fi
          ls -la dist-pkg/

      - name: Notarize and staple the .pkg
        if: matrix.os == 'macos-14'
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          if [ "${LPDO_PKG_SIGN:-0}" != "1" ]; then
            echo "Unsigned .pkg — skipping notarization."
            exit 0
          fi
          VER="$(jq -r .version chess-client/src-tauri/tauri.conf.json)"
          PKG="dist-pkg/LPDO_${VER}_aarch64.pkg"
          xcrun notarytool submit "$PKG" --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$PKG"
          spctl --assess --type install -vv "$PKG" || true

      - name: Attach .pkg to the draft release
        if: matrix.os == 'macos-14'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: gh release upload "$TAG" dist-pkg/*.pkg --clobber

      # ── Linux apt packages: lpdo-cli / lpdo-server ────────────────────────────
      # tauri-action above produced the GUI .deb (lpdo) + .appimage; here we build
      # the two companion .debs with nfpm and attach them to the same draft release.
      # `lpdo` Recommends lpdo-server, so `apt install lpdo` already pulls the full
      # desktop set — no metapackage needed.
      # Reuses the chess-db binary built earlier (with the normalise key baked in)
      # — do NOT rebuild it here without the key.
      - name: Compute Debian version
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          RAW="${{ github.event.inputs.tag || github.ref_name }}"
          VER="${RAW#v}"
          echo "LPDO_VERSION=$VER" >> "$GITHUB_ENV"
          # The GUI .deb's version comes from tauri.conf.json; lpdo-server pins
          # `lpdo (= $VER)` in its dependency, so they must match or it won't install.
          TAURI_VER=$(jq -r .version chess-client/src-tauri/tauri.conf.json)
          [ "$TAURI_VER" = "$VER" ] || { echo "version skew: tauri.conf $TAURI_VER != tag $VER"; exit 1; }

      - name: Install nfpm + lintian
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          NFPM_VER=2.43.0
          curl -sSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VER}/nfpm_${NFPM_VER}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin nfpm
          sudo apt-get install -y lintian

      - name: Build lpdo-cli / lpdo-server .debs
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          test -x target/release/chess-db   # built earlier with the baked key
          mkdir -p dist-deb
          for pkg in cli server; do
            nfpm pkg -f "packaging/nfpm-$pkg.yaml" -p deb -t dist-deb/
          done
          # Bring the GUI .deb into dist-deb under the lowercase, hyphen-consistent
          # name (lpdo_*), matching lpdo-cli / lpdo-server so `apt install ./lpdo*`
          # picks up all three. tauri-action names the file after productName
          # ("LPDO_…"); its Package: field is already `lpdo`, so this only fixes the
          # filename. The uppercase asset it uploaded is removed in the next step.
          gui=$(find target/release/bundle/deb -maxdepth 1 -name '*.deb' | head -1)
          test -n "$gui"   # fail loudly if the GUI .deb wasn't produced
          cp "$gui" "dist-deb/lpdo_${LPDO_VERSION}_amd64.deb"
          ls -la dist-deb/
          lintian dist-deb/*.deb || true   # advisory; don't fail the release

      - name: Attach .debs to the draft release
        if: matrix.os == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          # Drop the uppercase GUI .deb tauri-action uploaded; we replace it with
          # the lowercase lpdo_*.deb built above.
          gh release delete-asset "$TAG" "LPDO_${LPDO_VERSION}_amd64.deb" --yes || true
          gh release upload "$TAG" dist-deb/*.deb --clobber

  # Auto-fill the draft release body. Source of truth is the matching section of
  # CHANGELOG.md (so the file and the published notes never drift); if no section
  # exists for this version, fall back to a changelog built from the commit log
  # since the previous tag (GitHub's native generator is PR-based and this repo
  # commits straight to main, so it would yield only a compare link). Runs once
  # after both platform builds, and only when the body is still empty, so notes
  # written by hand on the draft are never overwritten.
  #
  # For the CHANGELOG path to work, the version's section must already exist at
  # the tagged commit — i.e. move "## [Unreleased]" to "## [X.Y.Z] - DATE" and
  # commit it before tagging the release.
  release-notes:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history + tags, to diff against the previous tag

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          current=$(gh release view "$TAG" --json body --jq '.body // ""' || echo "")
          if [ -n "$current" ]; then
            echo "Release $TAG already has notes; leaving them untouched."
            exit 0
          fi
          # Previous version tag = the next-lower tag in version order.
          prev=$(git tag --sort=-version:refname | awk -v cur="$TAG" 'found{print;exit} $0==cur{found=1}')
          # On a workflow_dispatch draft the tag doesn't exist as a git ref yet, so
          # the loop above finds nothing — fall back to the most recent existing tag
          # so the commit log is a sensible range, not the entire history.
          if [ -z "$prev" ] && ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            prev=$(git tag --sort=-version:refname | head -n1)
          fi
          [ -n "$prev" ] && footer="**Full Changelog**: https://github.com/$REPO/compare/$prev...$TAG" || footer=""

          # Pull the section for this version out of CHANGELOG.md: everything
          # between "## [X.Y.Z]" and the next "## " heading or link-ref block.
          version="${TAG#v}"
          section=""
          if [ -f CHANGELOG.md ]; then
            section=$(awk -v ver="$version" '
              $0 ~ ("^## \\[" ver "\\]") { cap=1; next }
              cap && (/^## / || /^\[[^]]+\]:/) { exit }
              cap { print }
            ' CHANGELOG.md | sed -e '/./,$!d' | tac | sed -e '/./,$!d' | tac)  # trim blank top+bottom
          fi

          if [ -n "$section" ]; then
            echo "Using CHANGELOG.md section for $version."
            { printf '%s\n' "$section"; [ -n "$footer" ] && { echo; echo "$footer"; }; } > notes.md
          else
            echo "No CHANGELOG.md section for $version; falling back to commit log."
            # Log up to HEAD (the checked-out commit), not "$TAG": on a
            # workflow_dispatch draft the tag isn't a git ref yet, and for a tag
            # push HEAD is that tag's commit anyway.
            { echo "## What's changed"; echo;
              git log --no-merges --pretty=format:'- %s' "${prev:+$prev..}HEAD"; echo;
              [ -n "$footer" ] && { echo; echo "$footer"; }; } > notes.md
          fi
          echo "----- release notes -----"; cat notes.md; echo "-------------------------"
          gh release edit "$TAG" --notes-file notes.md
