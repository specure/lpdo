name: Release

# Builds the LPDO desktop app for Debian/Linux, Windows and macOS (Apple
# Silicon) and attaches the installers to a DRAFT GitHub release for review
# before publishing.
#
# Triggered by pushing a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`)
# or manually via "Run workflow" (provide a tag name).
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   CHESSVAULT_NORMALISE_API_KEY — baked into the chess-db sidecar at compile time
#     so the released app can use the name-normalisation cache service. Without it
#     the app still works (FIDE-only normalisation).
#
#   macOS code-signing + notarization (optional — if unset, the .dmg builds
#   unsigned and Gatekeeper warns on first open):
#     APPLE_CERTIFICATE          — base64 of the Developer ID Application .p12
#     APPLE_CERTIFICATE_PASSWORD — the .p12 export password
#     APPLE_SIGNING_IDENTITY     — e.g. "Developer ID Application: SPECURE GmbH (4XZ94A6MUA)"
#     APPLE_API_ISSUER           — App Store Connect API Issuer ID (UUID)
#     APPLE_API_KEY              — App Store Connect API Key ID
#     APPLE_API_KEY_P8           — contents of the App Store Connect API .p8 file

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for the draft release (e.g. v0.1.0)'
        required: true
        default: 'v0.0.0-test'

permissions:
  contents: write   # create the release and upload assets

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            sidecar_src: target/release/chess-db
            sidecar_dst: chess-client/src-tauri/binaries/chess-db-x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - os: windows-latest
            sidecar_src: target/release/chess-db.exe
            sidecar_dst: chess-client/src-tauri/binaries/chess-db-x86_64-pc-windows-msvc.exe
            # NSIS .exe only — a single Windows download avoids the "which one
            # do I click?" choice. .msi (WiX) dropped; re-add if enterprise/MDM
            # (Intune/GPO) deployment is ever needed.
            bundles: nsis
          # macOS on Apple Silicon (M1+). The macos-14 runner is arm64, so the
          # default host target is aarch64-apple-darwin — no extra rustup target
          # needed. The .dmg is signed with the SPECURE GmbH Developer ID cert
          # and notarized (see the APPLE_* env on the build step), so Gatekeeper
          # opens it cleanly with no right-click workaround.
          - os: macos-14
            sidecar_src: target/release/chess-db
            sidecar_dst: chess-client/src-tauri/binaries/chess-db-aarch64-apple-darwin
            bundles: dmg

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: chess-client/package-lock.json

      - name: Setup Rust
        # Version kept in sync with /rust-toolchain.toml (the source of truth).
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '.'

      - name: Install frontend dependencies
        working-directory: chess-client
        run: npm ci

      # Build the chess-db sidecar separately so the secret key is baked in via
      # option_env! (build.rs forces a rebuild when the key changes). `tauri build`
      # does NOT recompile chess-db — it bundles the binary we copy here.
      - name: Build chess-db sidecar (with cache-service key)
        shell: bash
        env:
          CHESSVAULT_NORMALISE_API_KEY: ${{ secrets.CHESSVAULT_NORMALISE_API_KEY }}
        run: |
          cargo build -p chess-db --release
          mkdir -p "$(dirname "${{ matrix.sidecar_dst }}")"
          cp "${{ matrix.sidecar_src }}" "${{ matrix.sidecar_dst }}"

      # macOS notarization authenticates with an App Store Connect API key. The
      # key's .p8 is a file on disk, but secrets are strings, so materialise it
      # into the runner's temp dir and hand tauri-action the path. macOS only —
      # the other targets don't sign.
      - name: Write notarization API key
        if: matrix.os == 'macos-14'
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build app and attach to draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code-signing + notarization. tauri-action imports the cert into
          # a temporary keychain and runs notarytool when these are present; on
          # Linux/Windows they're unset and ignored. If the cert secret is empty
          # the macOS build still succeeds — just unsigned.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
        with:
          projectPath: chess-client
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'LPDO ${{ github.event.inputs.tag || github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: --bundles ${{ matrix.bundles }}

  # Auto-fill the draft release body. Source of truth is the matching section of
  # CHANGELOG.md (so the file and the published notes never drift); if no section
  # exists for this version, fall back to a changelog built from the commit log
  # since the previous tag (GitHub's native generator is PR-based and this repo
  # commits straight to main, so it would yield only a compare link). Runs once
  # after both platform builds, and only when the body is still empty, so notes
  # written by hand on the draft are never overwritten.
  #
  # For the CHANGELOG path to work, the version's section must already exist at
  # the tagged commit — i.e. move "## [Unreleased]" to "## [X.Y.Z] - DATE" and
  # commit it before tagging the release.
  release-notes:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history + tags, to diff against the previous tag

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          current=$(gh release view "$TAG" --json body --jq '.body // ""' || echo "")
          if [ -n "$current" ]; then
            echo "Release $TAG already has notes; leaving them untouched."
            exit 0
          fi
          # Previous version tag = the next-lower tag in version order.
          prev=$(git tag --sort=-version:refname | awk -v cur="$TAG" 'found{print;exit} $0==cur{found=1}')
          [ -n "$prev" ] && footer="**Full Changelog**: https://github.com/$REPO/compare/$prev...$TAG" || footer=""

          # Pull the section for this version out of CHANGELOG.md: everything
          # between "## [X.Y.Z]" and the next "## " heading or link-ref block.
          version="${TAG#v}"
          section=""
          if [ -f CHANGELOG.md ]; then
            section=$(awk -v ver="$version" '
              $0 ~ ("^## \\[" ver "\\]") { cap=1; next }
              cap && (/^## / || /^\[[^]]+\]:/) { exit }
              cap { print }
            ' CHANGELOG.md | sed -e '/./,$!d' | tac | sed -e '/./,$!d' | tac)  # trim blank top+bottom
          fi

          if [ -n "$section" ]; then
            echo "Using CHANGELOG.md section for $version."
            { printf '%s\n' "$section"; [ -n "$footer" ] && { echo; echo "$footer"; }; } > notes.md
          else
            echo "No CHANGELOG.md section for $version; falling back to commit log."
            { echo "## What's changed"; echo;
              git log --no-merges --pretty=format:'- %s' "${prev:+$prev..}$TAG"; echo;
              [ -n "$footer" ] && { echo; echo "$footer"; }; } > notes.md
          fi
          echo "----- release notes -----"; cat notes.md; echo "-------------------------"
          gh release edit "$TAG" --notes-file notes.md
