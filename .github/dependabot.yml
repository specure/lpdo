# Dependabot configuration.
#
# Rust is a Cargo *workspace*: the whole tree resolves to the single root
# Cargo.lock, and per-member lockfiles are ignored by the build. So point cargo
# at the workspace root ("/") — pointing it at the member crates (the previous
# default behaviour) produced PRs that updated nested lockfiles the build never
# reads, so the fixes never took effect. See /.gitignore.
#
# Updates are grouped so routine patch/minor bumps arrive as ONE PR per
# ecosystem instead of a flood; major bumps stay individual (they deserve a
# closer look). Tauri's crates + JS packages are grouped separately because the
# Rust crate and @tauri-apps/api must share a major.minor.
#
# `rebase-strategy: disabled` on each ecosystem stops Dependabot from
# auto-rebasing every open PR whenever main moves — that was re-triggering the
# (slow) CI on long-lived/deferred PRs on every single push. Rebase on demand
# with `@dependabot rebase` instead.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    rebase-strategy: disabled
    groups:
      tauri:
        patterns:
          - "tauri"
          - "tauri-*"
          - "wry"
      cargo-patch-minor:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: npm
    directory: "/chess-client"
    schedule:
      interval: weekly
    rebase-strategy: disabled
    groups:
      tauri-js:
        patterns:
          - "@tauri-apps/*"
      npm-patch-minor:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    rebase-strategy: disabled
    # The Rust toolchain is pinned deliberately via /rust-toolchain.toml; the
    # dtolnay action also pre-creates future-version branches, so Dependabot
    # otherwise proposes non-existent Rust versions (e.g. 1.100.0). Bump it by
    # hand alongside rust-toolchain.toml instead.
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
    groups:
      actions:
        patterns:
          - "*"
