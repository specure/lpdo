[package]
name = "chess-client"
version = "0.15.3"
description = "LPDO — desktop chess database for managing your games and preparing for tournaments"
authors = ["Specure"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# The installed/bundled executable is named `lpdo` (the Cargo package stays
# `chess-client` so the lib name `chess_client_lib` is unaffected).
[[bin]]
name = "lpdo"
path = "src/main.rs"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "chess_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
# Route a double-clicked .pgn (file association) to the already-running instance
# instead of spawning a second window (#104/#210).
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "fs", "io-util"] }
# Streamed PGN upload to the daemon (#154): stream the file body without
# buffering it, so a multi-GB import works and can target a remote server.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
fide-client = { path = "../../fide-client" }
chess-results-client = { path = "../../chess-results-client" }
# Lightweight, in-process PGN index/browse engine for opening large local PGN
# files without a server (#104). No DuckDB — header-only browse + replay.
chess-pgn = { path = "../../chess-pgn" }
# Like std::fs::canonicalize but strips Windows' \\?\ verbatim prefix so paths
# shown in the file browser stay readable (no-op on other platforms).
dunce = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

