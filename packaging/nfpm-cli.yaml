# lpdo-cli — the chess-db binary on PATH (CLI + client + `serve`).
# Built in CI with nfpm, reusing the release binary that has the normalise key baked in.
name: lpdo-cli
arch: amd64
platform: linux
version: ${LPDO_VERSION}
section: utils
priority: optional
maintainer: "SPECURE GmbH <jozef.svrcek@specure.com>"
homepage: "https://github.com/specure/lpdo"
license: Apache-2.0
description: |
  LPDO chess database command-line tool and client.
  The chess-db binary imports TWIC archives, searches games and players, edits
  the database, and transparently proxies to a running lpdo-server over HTTP
  (local or remote), falling back to direct access when no server is running.
depends:
  - libc6 (>= 2.34)
# The pre-0.5.0 build was a single monolithic `lpdo` package that owned
# /usr/bin/chess-db. That binary now lives in lpdo-cli, so declare the takeover:
# Replaces lets dpkg overwrite the file, and Conflicts makes apt remove the
# obsolete monolith automatically instead of erroring with "trying to overwrite
# /usr/bin/chess-db, which is also in package lpdo 0.3.0" (#208 / #215). Both are
# version-restricted to < 0.5.0, so the current `lpdo` GUI package is unaffected.
replaces:
  - lpdo (<< 0.5.0)
conflicts:
  - lpdo (<< 0.5.0)
contents:
  - src: target/release/chess-db
    dst: /usr/bin/chess-db
    file_info:
      mode: 0755
# On (re)install/upgrade, restart a running lpdo-server so it picks up the new
# chess-db binary — otherwise an `apt upgrade` leaves the old server running until
# reboot (#120). try-restart is a no-op for CLI-only users (no server).
scripts:
  postinstall: packaging/scripts/cli.postinst
